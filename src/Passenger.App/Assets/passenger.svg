<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F6BF2"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#ground)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#shine)"/>
  <!-- A P: its stem, and its bowl as a thick open ring. -->
  <rect x="300" y="190" width="120" height="584" rx="60" fill="#FFFFFF"/>
  <path d="M 360 250 H 560 A 170 170 0 0 1 560 590 H 360" fill="none" stroke="#FFFFFF" stroke-width="120" stroke-linecap="butt" stroke-linejoin="round"/>
  <!-- A seat taken: the passenger. -->
  <circle cx="700" cy="720" r="74" fill="#FFB547"/>
</svg>
