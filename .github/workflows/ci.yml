# Every push to main and every pull request: the solution built (warnings are errors) and every test run, on macOS
# (arm64) and Windows, as `just build` and `just test` run them; the macOS disk images made and checked, as
# `just package-mac` makes them; the Windows installer built, installed, used and uninstalled, as `just package-win`
# builds it; and on Linux, the solution restored from nothing and every package checked against THIRD_PARTY_NOTICES.md.
# Every restore is locked to the packages.lock.json files (GitHub sets CI, which Directory.Build.props makes
# RestoreLockedMode). Actions are pinned to a release's commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push replaces its run; every commit to main keeps its own.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Avalonia's build task sends usage data from every build unless this is in the environment.
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      # One system's failure never hides the other's result.
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            os: macos-latest
          - name: Windows (x64)
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # The whole history: tools/package-mac.sh names a build by its tags and commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The SDK global.json names exactly (a release candidate), and .NET 10 for the debuggees and the tests' projects.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      # The runner's .NET is in ~/.dotnet, not where the macOS installer puts it: registered as an installer registers
      # another place, so the IDE started with launchd's bare environment (McpTests) finds its runtime, as on a Mac.
      - name: Register .NET's install location
        if: runner.os == 'macOS'
        run: sudo mkdir -p /etc/dotnet && echo "$DOTNET_ROOT" | sudo tee /etc/dotnet/install_location

      # The runtime's createdump (a memory snapshot) reads its program as a debugger does, which macOS lets a third party's
      # tool do once a member of _developer answers the system.privilege.taskport password prompt, remembered for ten
      # hours. A developer's Mac asks once a session; the runner has no one to answer, so the prompt waits for ever. The
      # runner joins _developer and the right asks its members nothing, as developer mode does for Apple's own tools; the
      # state before is printed for a hang that remains.
      - name: Let debugging tools read the runner's processes
        if: runner.os == 'macOS'
        run: |
          DevToolsSecurity -status
          id -Gn
          security authorizationdb read system.privilege.taskport | plutil -p -
          sudo dseditgroup -o edit -a "$USER" -t user _developer
          sudo dscacheutil -flushcache
          sudo security authorizationdb write system.privilege.taskport is-developer

      - name: Restore cached NuGet packages
        id: nuget
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', '**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-

      # Only what the lock files name, each package's content hash checked against them.
      - name: Restore
        run: dotnet restore --locked-mode

      # Saved once restored, so a failing build or test still leaves the next run its packages.
      - name: Cache NuGet packages
        if: steps.nuget.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget.outputs.cache-primary-key }}

      - name: Build
        run: dotnet build --no-restore

      # A file the .gitignore matches never reaches a clone (#58). After the build, so one that wrote beside the
      # sources shows too; and no tracked file may match a rule, since its folder's other files would not be seen.
      - name: No source is ignored by Git
        run: |
          hidden=$(git ls-files --others --ignored --exclude-standard -- src tests tools site
                   git ls-files --cached --ignored --exclude-standard)
          if [ -n "$hidden" ]; then
            echo "::error title=Ignored sources::The .gitignore matches these, so a clone would not have them or their neighbours"
            echo "$hidden"
            exit 1
          fi

      # A test hung for 10 minutes is stopped and named, rather than holding the job to its timeout. On a failure the
      # failed tests are listed last, as annotations and in the run's summary.
      - name: Test
        shell: pwsh
        timeout-minutes: 40
        run: |
          dotnet test tests/Passenger.Tests --no-build --results-directory TestResults `
            --logger trx --logger "console;verbosity=normal" `
            --blame-hang-timeout 10m --blame-hang-dump-type none
          $code = $LASTEXITCODE
          if ($code -eq 0) { exit 0 }
          $failed = @(Get-ChildItem TestResults -Recurse -Filter *.trx -ErrorAction SilentlyContinue | ForEach-Object {
            ([xml](Get-Content -Raw $_.FullName)).TestRun.Results.UnitTestResult |
              Where-Object { $_ -and $_.outcome -notin 'Passed', 'NotExecuted' }
          })
          # The workflow command's own escapes: % and line breaks in a message, and : and , in a property too.
          function Escape([string] $text, [switch] $property) {
            $text = $text.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            if ($property) { $text = $text.Replace(':', '%3A').Replace(',', '%2C') }
            $text
          }
          $heading = "Tests failed on ${env:RUNNER_OS}: $($failed.Count)"
          if ($failed.Count -eq 0) {
            $heading = "dotnet test failed on ${env:RUNNER_OS} with no failed test in its results: the log above says what crashed or hung"
          }
          $summary = @("### $heading", '')
          Write-Host "`n$heading"
          foreach ($test in $failed) {
            $message = "$($test.Output.ErrorInfo.Message)".Trim()
            Write-Host "  $($test.testName) ($($test.outcome))"
            Write-Host "::error title=$(Escape $test.testName -property)::$(Escape $message)"
            $summary += "- ``$($test.testName)`` ($($test.outcome)): $(($message -split "`n")[0].Trim())"
          }
          $summary | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          exit $code

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ runner.os }}
          path: TestResults/
          if-no-files-found: ignore

  # #36: each processor's disk image, made with no Developer ID here (the app signed ad hoc, nothing notarized), which
  # tools/package-mac.sh mounts read-only and checks before it is done: the app's signature, its version and the volume's,
  # Roslyn's server and the debugger's adapter in it, and every Mach-O file built for the image's processor. The x64
  # image is cross-published on the arm64 runner. Publishing the images with a release is #56's.
  package:
    name: Disk image (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      # The whole history, since the build number counts the commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The test job's packages, when it has saved them; this job saves none of its own.
      - name: Restore cached NuGet packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', '**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Make and check the disk image
        run: tools/package-mac.sh ${{ matrix.rid }}

  # #34: the Windows installer as `just package-win` builds it, installed silently as a person's would be (per user, no
  # administrator), an agent debugging a project through the Passenger it installed (so its Roslyn server and debugger
  # run from the install), then uninstalled, with what each step must leave checked. Unsigned: a release (#56) signs it
  # through the variables tools/package-win.sh reads, from the repository's secrets; a check need not spend signatures.
  installer:
    name: Windows installer (x64)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # The whole history: tools/package-win.sh names the version by the commit's tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # .NET 10 runs vpk and the test's project, as in the test job.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      # The test job's packages, when it has saved them; this job saves none of its own.
      - name: Restore cached NuGet packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', '**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build the installer
        run: tools/package-win.sh win-x64

      # A person's state, which the uninstall must leave, is there before the install, as it is for one who reinstalls.
      - name: Install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $state = Join-Path $env:LOCALAPPDATA 'Passenger'
          New-Item -ItemType Directory -Force -Path $state | Out-Null
          Set-Content -Path (Join-Path $state 'kept-by-uninstall.txt') -Value 'a person''s state'
          $setup = Start-Process -FilePath artifacts/package/Passenger-windows-x64.exe -ArgumentList '--silent' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Setup --silent exited $($setup.ExitCode)" }
          $root = Join-Path $env:LOCALAPPDATA 'PassengerIDE'
          $exe = Join-Path $root 'current\Passenger.exe'
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'Passenger.lnk'
          foreach ($path in $exe, (Join-Path $root 'Update.exe'), (Join-Path $root 'current\roslyn'), (Join-Path $root 'current\debugger'), $shortcut) {
            if (-not (Test-Path $path)) { throw "The install has no $path" }
          }
          $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\PassengerIDE'
          if ($entry.DisplayName -ne 'Passenger') { throw "Settings > Apps lists the install as '$($entry.DisplayName)'" }
          # The runner's Visual Studio keeps these types' default, so Passenger is among the programs that open them.
          foreach ($extension in '.sln', '.slnx', '.csproj') {
            $command = (Get-Item "HKCU:\Software\Classes\Passenger$extension\shell\open\command").GetValue('')
            if ($command -ne "`"$exe`" `"%1`"") { throw "Passenger$extension opens with '$command', not Passenger.exe" }
            if ((Get-Item "HKCU:\Software\Classes\$extension\OpenWithProgids").GetValueNames() -notcontains "Passenger$extension") {
              throw "$extension does not list Passenger among the programs that open it"
            }
          }
          "PASSENGER_EXECUTABLE=$exe" >> $env:GITHUB_ENV

      - name: Build the tests
        run: dotnet build tests/Passenger.Tests

      - name: An agent debugs through the installed Passenger
        run: dotnet test tests/Passenger.Tests --no-build --filter "FullyQualifiedName~McpTests.An_agent_with_a_windowless_Passenger_finds_code_reads_its_warnings_and_debugs_it" --blame-hang-timeout 10m --blame-hang-dump-type none

      # Update.exe removes the folder a few seconds after it exits; the person's state and Velopack's own logs
      # (%LocalAppData%\velopack) stay.
      - name: Uninstall
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:LOCALAPPDATA 'PassengerIDE'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\PassengerIDE'
          $quiet = (Get-ItemProperty $key).QuietUninstallString
          if ($quiet -ne "`"$root\Update.exe`" --uninstall --silent") { throw "Settings > Apps uninstalls it silently with '$quiet'" }
          $uninstall = Start-Process -FilePath (Join-Path $root 'Update.exe') -ArgumentList '--uninstall', '--silent' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Update.exe --uninstall --silent exited $($uninstall.ExitCode)" }
          for ($i = 0; $i -lt 60 -and (Test-Path $root); $i++) { Start-Sleep -Seconds 1 }
          $left = @()
          if (Test-Path $root) { $left += "$root, with $(@(Get-ChildItem -Recurse -Force $root).Count) files" }
          if (Test-Path $key) { $left += 'its entry in Settings > Apps' }
          if (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'Passenger.lnk')) { $left += 'its Start menu entry' }
          foreach ($extension in '.sln', '.slnx', '.csproj') {
            if (Test-Path "HKCU:\Software\Classes\Passenger$extension") { $left += "the Passenger$extension file type" }
            $openWith = Get-Item "HKCU:\Software\Classes\$extension\OpenWithProgids" -ErrorAction SilentlyContinue
            if ($openWith -and $openWith.GetValueNames() -contains "Passenger$extension") { $left += "Passenger among the programs that open $extension" }
            $type = Get-Item "HKCU:\Software\Classes\$extension" -ErrorAction SilentlyContinue
            if ($type -and $type.GetValue('') -eq "Passenger$extension") { $left += "Passenger as what opens $extension" }
          }
          if ($left) { throw "The uninstall left $($left -join '; ')" }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'Passenger\kept-by-uninstall.txt'))) { throw "The uninstall took the person's state" }

      # For trying a pull request's installer by hand; not a release (#56).
      - name: Upload the installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Passenger-windows-x64
          path: artifacts/package/Passenger-windows-x64.exe
          retention-days: 7

  # #57's first step: the solution restores on Linux, in locked mode, with no package cache, so every package is
  # downloaded again and its signature checked against nuget.config's trusted signers, as NuGet does on Linux (and
  # Windows) but not on macOS. Then every package restored, and every one Roslyn's server carries, must be named in
  # the notices.
  packages:
    name: Packages (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Passenger.slnx --locked-mode

      - name: Every package in the notices
        run: python3 -I tools/check-notices.py
