# The solution built (warnings are errors) and every test run, on macOS (arm64), Windows and Linux (Ubuntu LTS, x64), as
# `just build` and `just test` run them, each system's tests split across shards that run at once (#206): CI's (ci.yml)
# when it is run by hand, and a release's (release.yml) before it packages anything. The results go where `just test`
# puts them, artifacts/test-results. Every restore is locked to the packages.lock.json files (GitHub sets CI, which
# Directory.Build.props makes RestoreLockedMode). Actions are pinned to a release's commit.
name: Test

on:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Avalonia's build task sends usage data from every build unless this is in the environment.
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  # One shard of a system's tests, on a runner of its own. Each shard builds the solution itself, two minutes beside the
  # others, rather than all of them waiting on one build and its 2 GB of output uploaded once and downloaded by each.
  # Each lists the whole suite and deals its classes to the system's shards by their seconds there
  # (tools/test-shards.py, tests/Passenger.Tests/TestTimes.json): the same deal in every shard of a commit, of which it
  # runs its own hand. Inside a shard xunit keeps the suite's order: the protocol tests beside the window tests, and
  # Alone's classes after both with nothing beside them.
  shard:
    name: ${{ matrix.name }}, shard ${{ matrix.shard }} of ${{ matrix.shards }}
    strategy:
      # One shard's failure never hides another's result.
      fail-fast: false
      matrix:
        system: [macOS, Windows, Linux]
        # A system's number of shards is its `shards` below, and these numbers up to it (a system with fewer excludes
        # its others). With four, about 13 to 15 minutes of tests each; GitHub runs five macOS jobs at once, the fifth
        # CI's disk image.
        shard: [1, 2, 3, 4]
        # time_scale multiplies every test's wall-clock limit, each written as the time on the Mac
        # (PASSENGER_TEST_TIME_SCALE): the 90th percentile of how much longer each test of a second or more on the Mac took
        # on the system's runner (run 39301973028's .trx files against the Mac's, 19 October: macOS 2.23, Windows 2.64,
        # Linux 1.96), to the nearest half.
        include:
          - system: macOS
            name: macOS (arm64)
            os: macos-latest
            shards: 4
            time_scale: 2
          - system: Windows
            name: Windows (x64)
            os: windows-latest
            shards: 4
            time_scale: 2.5
          - system: Linux
            name: Linux (x64)
            os: ubuntu-24.04
            shards: 4
            time_scale: 2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      # The whole history: tools/package-mac.sh names a build by its tags and commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The SDK global.json names exactly (a release candidate), and .NET 10 for the debuggees and the tests' projects.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      # The runner's .NET is in ~/.dotnet, not where the macOS installer puts it: registered as an installer registers
      # another place, so the IDE started with launchd's bare environment (McpTests) finds its runtime, as on a Mac.
      - name: Register .NET's install location
        if: runner.os == 'macOS'
        run: sudo mkdir -p /etc/dotnet && echo "$DOTNET_ROOT" | sudo tee /etc/dotnet/install_location

      # The runtime's createdump (a memory snapshot) reads its program as a debugger does, which macOS lets a third party's
      # tool do once a member of _developer answers the system.privilege.taskport password prompt, remembered for ten
      # hours. A developer's Mac asks once a session; the runner has no one to answer, so the prompt waits for ever. The
      # runner joins _developer and the right asks its members nothing, as developer mode does for Apple's own tools; the
      # state before is printed for a hang that remains.
      - name: Let debugging tools read the runner's processes
        if: runner.os == 'macOS'
        run: |
          DevToolsSecurity -status
          id -Gn
          security authorizationdb read system.privilege.taskport | plutil -p -
          sudo dseditgroup -o edit -a "$USER" -t user _developer
          sudo dscacheutil -flushcache
          sudo security authorizationdb write system.privilege.taskport is-developer

      # What site/linux.html asks a person to install: Git, the window's X11 libraries, and fontconfig, which Skia draws
      # the headless tests' text with too.
      - name: The libraries Passenger needs on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git libx11-6 libice6 libsm6 libfontconfig1

      - name: Restore cached NuGet packages
        id: nuget
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', '**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-

      # Only what the lock files name, each package's content hash checked against them.
      - name: Restore
        run: dotnet restore --locked-mode

      # Saved once restored, so a failing build or test still leaves the next run its packages; by one shard of each
      # system, since the others would only find the key taken.
      - name: Cache NuGet packages
        if: matrix.shard == 1 && steps.nuget.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget.outputs.cache-primary-key }}

      - name: Build
        run: dotnet build --no-restore

      # A file the .gitignore matches never reaches a clone (#58). After the build, so one that wrote beside the
      # sources shows too; and no tracked file may match a rule, since its folder's other files would not be seen.
      - name: No source is ignored by Git
        if: matrix.shard == 1
        run: |
          hidden=$(git ls-files --others --ignored --exclude-standard -- src tests tools site
                   git ls-files --cached --ignored --exclude-standard)
          if [ -n "$hidden" ]; then
            echo "::error title=Ignored sources::The .gitignore matches these, so a clone would not have them or their neighbours"
            echo "$hidden"
            exit 1
          fi

      # The deal goes in the log. Before any test runs, what each shard's settings select is listed and every test of
      # the suite must be in exactly one. The suite's listing and the shards' settings go with the results: the summary
      # checks the results against the listing, and a person sees what each shard ran. A listing that names no test, or
      # says discovery failed (xunit 3.2's runner can spoil its answer to the adapter's -assemblyInfo, xunit #3576), is
      # listed again, and the step fails with what dotnet printed only when the last of three tries is no better.
      - name: Deal the tests to the shards
        env:
          SYSTEM: ${{ matrix.system }}
          SHARDS: ${{ matrix.shards }}
        run: |
          python=python3
          [ "$RUNNER_OS" != Windows ] || python=python
          results=artifacts/test-results
          mkdir -p "$results/shards"
          "$python" -I tools/test-shards.py list "$results/suite.txt"
          "$python" -I tools/test-shards.py split "$results/suite.txt" --system "$SYSTEM" --of "$SHARDS" --out "$results/shards"
          for number in $(seq 1 "$SHARDS"); do
            "$python" -I tools/test-shards.py list "$results/shards/listed-$number.txt" \
              --settings "$results/shards/shard-$number.runsettings"
          done
          "$python" -I tools/test-shards.py check "$results/suite.txt" "$results"/shards/listed-*.txt

      # A test hung for 10 minutes is stopped and named, rather than holding the job to its timeout. Each test class's
      # time goes in the job's summary (tools/test-times.py), a class over its budget is a warning, and the shard over
      # tests/Passenger.Tests/TestBudget.json's minutes fails, with the table that says where the time went; the step's
      # timeout is above that budget, so a slow shard is failed by it rather than ended with no table. On a failure the
      # failed tests are listed last, as annotations and in the job's summary.
      - name: Test
        shell: pwsh
        timeout-minutes: 30
        env:
          SHARD: ${{ matrix.shard }}
          LABEL: ${{ matrix.name }}, shard ${{ matrix.shard }} of ${{ matrix.shards }}
          PASSENGER_TEST_TIME_SCALE: ${{ matrix.time_scale }}
        run: |
          $results = 'artifacts/test-results'
          dotnet test tests/Passenger.Tests --no-build --settings "$results/shards/shard-$env:SHARD.runsettings" `
            --results-directory $results --logger trx --logger "console;verbosity=normal" `
            --blame-hang-timeout 10m --blame-hang-dump-type none
          $code = $LASTEXITCODE
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          & $python -I tools/test-times.py $results --budget tests/Passenger.Tests/TestBudget.json --shard $env:SHARD --label $env:LABEL
          $budget = $LASTEXITCODE
          if ($code -eq 0) { exit $budget }
          $failed = @(Get-ChildItem $results -Recurse -Filter *.trx -ErrorAction SilentlyContinue | ForEach-Object {
            ([xml](Get-Content -Raw $_.FullName)).TestRun.Results.UnitTestResult |
              Where-Object { $_ -and $_.outcome -notin 'Passed', 'NotExecuted' }
          })
          # The workflow command's own escapes: % and line breaks in a message, and : and , in a property too.
          function Escape([string] $text, [switch] $property) {
            $text = $text.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            if ($property) { $text = $text.Replace(':', '%3A').Replace(',', '%2C') }
            $text
          }
          $heading = "Tests failed on ${env:LABEL}: $($failed.Count)"
          if ($failed.Count -eq 0) {
            $heading = "dotnet test failed on ${env:LABEL} with no failed test in its results: the log above says what crashed or hung"
          }
          $summary = @("### $heading", '')
          Write-Host "`n$heading"
          foreach ($test in $failed) {
            $message = "$($test.Output.ErrorInfo.Message)".Trim()
            Write-Host "  $($test.testName) ($($test.outcome))"
            Write-Host "::error title=$(Escape $test.testName -property)::$(Escape $message)"
            $summary += "- ``$($test.testName)`` ($($test.outcome)): $(($message -split "`n")[0].Trim())"
          }
          $summary | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          exit $code

      # Which shard this was and how its job ended, beside its results: the summary job's to read.
      - name: Say how the shard ended
        if: ${{ !cancelled() }}
        env:
          SYSTEM: ${{ matrix.system }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
          STATUS: ${{ job.status }}
        run: |
          mkdir -p artifacts/test-results
          printf '{"system": "%s", "shard": %s, "shards": %s, "status": "%s"}\n' "$SYSTEM" "$SHARD" "$SHARDS" "$STATUS" \
            > artifacts/test-results/shard.json

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.system }}-${{ matrix.shard }}
          path: artifacts/test-results/

  # Each system's result as one check, under the name its one job had before the shards: every shard's job succeeded
  # and every test of the suite has exactly one result among them (tools/test-shards.py cover), with each class's time
  # across them in the summary (tools/test-times.py), and a warning when dealing from this run's times would end the
  # slowest shard two minutes sooner or more (`just test-times RUN` writes them to TestTimes.json, for a person to
  # commit, since CI commits nothing). It waits for every system's shards, as one matrix job's needs must.
  summary:
    name: ${{ matrix.name }}
    needs: shard
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: macOS
            name: macOS (arm64)
          - system: Windows
            name: Windows (x64)
          - system: Linux
            name: Linux (x64)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            tools
            tests/Passenger.Tests

      # Each shard's artifact in a folder of its own, or, when only one shard left any, in results itself.
      - name: Download the shards' results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results-${{ matrix.system }}-*
          path: results

      - name: Test times
        env:
          NAME: ${{ matrix.name }}
        run: |
          if [ -n "$(find results -name '*.trx' 2> /dev/null)" ]; then
            python3 -I tools/test-times.py results --budget tests/Passenger.Tests/TestBudget.json --summary --label "$NAME"
          fi

      - name: Every test ran in exactly one shard
        if: ${{ !cancelled() }}
        env:
          SYSTEM: ${{ matrix.system }}
        run: python3 -I tools/test-shards.py cover results --system "$SYSTEM"
